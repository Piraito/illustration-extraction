name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  layered-tiff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements-layered.txt
      - name: Validate editable TIFF structure
        run: python -m unittest discover -s tests -p 'test_layered_tiff.py' -v
      - name: Validate adaptive masks
        run: python -m unittest discover -s tests -p 'test_adaptive_mask.py' -v
      - name: Validate diagnostic maps
        run: python -m unittest discover -s tests -p 'test_diagnose_masks.py' -v
      - name: Validate chromatic probe
        run: python -m unittest discover -s tests -p 'test_chroma_probe.py' -v
      - name: Compile scripts
        run: python -m compileall -q src tests
